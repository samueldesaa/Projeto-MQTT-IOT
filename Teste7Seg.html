<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Display 7 Segmentos</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      color: white;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      font-size: 18px;
      text-align: center;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 20px;
      width: 220px;
    }

    .display {
      position: relative;
      width: 120px;
      height: 200px;
    }

    .segment {
      position: absolute;
      background: #222;
      transition: 0.2s;
    }

    .on {
      background: red;
      box-shadow: 0 0 10px red;
    }

    /* Segmentos */
    .a { top: 0; left: 20px; width: 80px; height: 20px; }
    .b { top: 20px; right: 0; width: 20px; height: 70px; }
    .c { bottom: 20px; right: 0; width: 20px; height: 70px; }
    .d { bottom: 0; left: 20px; width: 80px; height: 20px; }
    .e { bottom: 20px; left: 0; width: 20px; height: 70px; }
    .f { top: 20px; left: 0; width: 20px; height: 70px; }
    .g { top: 90px; left: 20px; width: 80px; height: 20px; }

  </style>
</head>
<body>

  <h1>Display 7 Segmentos</h1>

  <input 
    type="text" 
    id="binInput" 
    placeholder="Ex: 0,0,1,1,1,1,1"
    oninput="atualizarDisplay()"
  >

  <div class="display">
    <div class="segment a"></div>
    <div class="segment b"></div>
    <div class="segment c"></div>
    <div class="segment d"></div>
    <div class="segment e"></div>
    <div class="segment f"></div>
    <div class="segment g"></div>
  </div>

  <script>
    function atualizarDisplay() {
      const input = document.getElementById("binInput").value;

      // separa por vírgula
      const valores = input.split(",");

      if (valores.length !== 7) return;

      const segmentos = document.querySelectorAll(".segment");

      for (let i = 0; i < 7; i++) {
        if (valores[i].trim() === "1") {
          segmentos[i].classList.add("on");
        } else {
          segmentos[i].classList.remove("on");
        }
      }
    }
  </script>

</body>
</html>
