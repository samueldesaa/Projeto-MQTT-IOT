<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Controle MQTT - Publish</title>

  <!-- Biblioteca MQTT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .verde { background: green; color: white; }
    .vermelho { background: red; color: white; }
  </style>
</head>

<body>

  <h2>Controle MQTT - Apenas Publish</h2>

  <p id="status">Conectando...</p>

  <h3>LED VERDE</h3>
  <button class="verde" onclick="enviar('samuel/ledVerde','on')">LIGAR</button>
  <button onclick="enviar('samuel/ledVerde','off')">DESLIGAR</button>

  <h3>LED VERMELHO</h3>
  <button class="vermelho" onclick="enviar('samuel/ledVermelho','on')">LIGAR</button>
  <button onclick="enviar('samuel/ledVermelho','off')">DESLIGAR</button>

  <script>
    const clientID = "samuel_" + Math.random().toString(16).substr(2, 8);

    const client = new Paho.Client(
      "broker.emqx.io",
      8083,
      clientID
    );

    client.onConnectionLost = function() {
      document.getElementById("status").innerText = "Conexão perdida ❌";
    };

    client.connect({
      cleanSession: true,
      onSuccess: function() {
        document.getElementById("status").innerText = "Conectado ✅";
      },
      onFailure: function() {
        document.getElementById("status").innerText = "Erro ao conectar ❌";
      }
    });

    function enviar(topico, valor) {
      if (!client.isConnected()) {
        alert("Ainda não conectado!");
        return;
      }

      const msg = new Paho.Message(valor);
      msg.destinationName = topico;

      client.send(msg);

      console.log("Enviado:", topico, valor);
    }
  </script>

</body>
</html>
